<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeroBrick viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0E0E10; color: #F4F1EA; font: 14px system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 16px; left: 16px; display: flex; gap: 8px; align-items: center; }
  select, button { background: #1b1b1f; color: #F4F1EA; border: 1px solid #333; border-radius: 8px; padding: 8px 12px; }
  b { color: #FF4D1C; letter-spacing: 2px; }
  #hint { position: fixed; bottom: 16px; left: 16px; opacity: .6; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="ui"><b>ZEROBRICK</b><select id="pick"></select><button id="top">Top view</button><button id="iso">3D view</button></div>
<div id="hint">drag to orbit, scroll to zoom, drop a .glb file to load it</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0E0E10);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(10, 20, 8);
scene.add(sun);
const grid = new THREE.GridHelper(60, 60, 0x444444, 0x222222);
grid.position.y = -0.2;
scene.add(grid);

const loader = new GLTFLoader();
let root = null;

function frame(top = false) {
  const box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  const d = Math.max(s.x, s.z) * 1.5;
  controls.target.copy(c);
  if (top) camera.position.set(c.x, c.y + d * 1.6, c.z + 0.01);
  else camera.position.set(c.x + d, c.y + d * 0.9, c.z + d);
  controls.update();
}
function show(gltf) {
  if (root) scene.remove(root);
  root = gltf.scene;
  scene.add(root);
  frame();
}

const pick = document.getElementById("pick");
const names = await (await fetch("models/index.json")).json();
pick.innerHTML = names.map(n => `<option>${n}</option>`).join("");
pick.onchange = () => loader.load("models/" + pick.value, show);
loader.load("models/" + names[0], show);

document.getElementById("top").onclick = () => root && frame(true);
document.getElementById("iso").onclick = () => root && frame(false);

addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) f.arrayBuffer().then(b => loader.parse(b, "", show));
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
